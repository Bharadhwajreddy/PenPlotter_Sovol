<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fish Tank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* Layout: presenter panel + phone frame on desktop; the phone app alone, full screen, on phones.
   Each user type is its own app: business = teal water, investor = gold, helper = plum. */
:root{
  --page:#E4ECEA; --bg:#F5F8F7; --surface:#FFFFFF; --surface-2:#EBF1F0; --ink:#0C2630; --ink-2:#4B6570; --line:#D9E3E1; --frame:#0C2630;
  --teal:#0E6F69; --teal-soft:#D3EDE9; --teal-text:#0B5C57; --teal-ink:#FFFFFF;
  --gold:#A35F00; --gold-soft:#FBECD6; --gold-text:#8A4F00; --gold-ink:#FFFFFF;
  --plum:#8A3B78; --plum-soft:#F4E3EF; --plum-text:#7A2F69; --plum-ink:#FFFFFF;
  --good:#17803D; --good-soft:#DDF2E4; --warn:#A35F00; --warn-soft:#FBECD6; --bad:#B42318; --bad-soft:#FBE4E1;
  --acc:var(--teal); --acc-soft:var(--teal-soft); --acc-text:var(--teal-text); --acc-ink:var(--teal-ink);
  --shadow:0 1px 2px rgba(12,38,48,.06),0 10px 30px rgba(12,38,48,.08);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans Devanagari","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#03121A; --bg:#071B21; --surface:#0D262E; --surface-2:#133440; --ink:#E3F0EF; --ink-2:#9DB9BF; --line:#1E4350; --frame:#000000;
  --teal:#34B8AC; --teal-soft:#10393A; --teal-text:#7ADBD0; --teal-ink:#03201D;
  --gold:#F2A93B; --gold-soft:#3A2A10; --gold-text:#FFCB7A; --gold-ink:#2A1700;
  --plum:#D07CC0; --plum-soft:#3A1A33; --plum-text:#F0B2E4; --plum-ink:#2A0B23;
  --good:#4ADE80; --good-soft:#0E3320; --warn:#FBBF24; --warn-soft:#3A2A10; --bad:#F87171; --bad-soft:#3B1412;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#03121A; --bg:#071B21; --surface:#0D262E; --surface-2:#133440; --ink:#E3F0EF; --ink-2:#9DB9BF; --line:#1E4350; --frame:#000000;
  --teal:#34B8AC; --teal-soft:#10393A; --teal-text:#7ADBD0; --teal-ink:#03201D;
  --gold:#F2A93B; --gold-soft:#3A2A10; --gold-text:#FFCB7A; --gold-ink:#2A1700;
  --plum:#D07CC0; --plum-soft:#3A1A33; --plum-text:#F0B2E4; --plum-ink:#2A0B23;
  --good:#4ADE80; --good-soft:#0E3320; --warn:#FBBF24; --warn-soft:#3A2A10; --bad:#F87171; --bad-soft:#3B1412;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}
.app[data-mode="inv"]{--acc:var(--gold);--acc-soft:var(--gold-soft);--acc-text:var(--gold-text);--acc-ink:var(--gold-ink)}
.app[data-mode="help"]{--acc:var(--plum);--acc-soft:var(--plum-soft);--acc-text:var(--plum-text);--acc-ink:var(--plum-ink)}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:var(--acc-text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}

/* stage */
.stage{height:100%;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center;
  padding-block:20px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.presenter{display:flex;flex-direction:column;gap:20px;max-height:100%;overflow:auto;padding-right:6px;min-width:0}
.device{width:392px;height:min(820px,calc(100vh - 40px));border:10px solid var(--frame);border-radius:46px;overflow:hidden;box-shadow:0 30px 60px rgba(4,20,26,.25);background:var(--bg);position:relative}
@media (max-width:920px){
  .stage{display:block;padding:0;max-width:none}
  .presenter{display:none}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}

/* presenter */
.p-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px}
.p-brand svg{width:36px;height:36px}
.p-brand small{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.p-title{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.025em}
.p-lead{font-size:17px;color:var(--ink-2);max-width:52ch}
.p-users{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.p-user{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink)}
.p-user:hover{border-color:var(--ink-2)}
.p-user[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.p-user .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.p-user b{display:block;font-size:15.5px}
.p-user span{font-size:13px;color:var(--ink-2)}
.p-now{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.p-now ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:14.5px}
details.p-more{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
details.p-more summary{font-weight:700;cursor:pointer}
details.p-more[open] summary{margin-bottom:10px}
.p-facts{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.p-facts b{font-family:var(--f-display);font-size:20px}
.p-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}

/* app shell */
.app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.appbar{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.appbar .logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px}
.appbar .logo svg{width:28px;height:28px}
.mode-pill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--acc-soft);color:var(--acc-text);border-radius:999px;padding:4px 10px}
.appbar .sp{flex:1}
.icon-btn{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.tabbar{display:grid;border-top:1px solid var(--line);background:var(--surface);padding:6px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;color:var(--ink-2);font-size:12px;font-weight:700;min-width:0}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--acc-text);background:var(--acc-soft)}
.tabbar .ico{width:22px;height:22px}

/* type + blocks */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-text)}
.h1{font-size:27px;font-weight:800}
.h2{font-size:19px;font-weight:700}
.hello{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flat{background:var(--surface-2);border-color:transparent}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.wrap-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:13px 20px;font-weight:800;font-size:16px;line-height:1.2;text-decoration:none;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--acc-soft);color:var(--acc-text)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.acc{background:var(--acc-soft);color:var(--acc-text)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag .ico{width:14px;height:14px;vertical-align:-2px}
.note{border-radius:14px;padding:12px 14px;background:var(--surface-2);color:var(--ink-2);font-size:14px}
.note.acc{background:var(--acc-soft);color:var(--acc-text)}
.note .ico{width:16px;height:16px;vertical-align:-3px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px}
.input:focus{border-color:var(--acc);outline:none}
textarea.input{resize:vertical;min-height:84px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-weight:800;font-size:15px}

/* onboarding */
.onb{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));gap:18px}
.splash{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:28px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 70% at 70% 10%,#1A8C84 0%,#0B4F55 55%,#062E36 100%);color:#F3FBFA;overflow:hidden}
.splash h1{font-size:46px;font-weight:800;letter-spacing:-.03em;color:#F3FBFA}
.splash p{color:#CDEAE6;font-size:17px}
.splash .fishmark{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:150px;height:150px}
.splash .bub{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
@media (prefers-reduced-motion:no-preference){
  .splash .bub{animation:rise 7s linear infinite}
  .splash .fishmark{animation:swim 4s ease-in-out infinite}
  @keyframes rise{from{transform:translateY(40px);opacity:0}20%{opacity:1}to{transform:translateY(-160px);opacity:0}}
  @keyframes swim{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
}
.splash .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#F3FBFA}
.splash .chip[aria-pressed="true"]{background:#F3FBFA;color:#0B4F55;border-color:#F3FBFA}
.splash .btn.primary{background:#F2A93B;color:#2A1700}
.door{display:flex;gap:14px;align-items:center;text-align:left;border-radius:22px;padding:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.door:hover{box-shadow:var(--shadow)}
.door .dot{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.door .dot .ico{width:26px;height:26px}
.door b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.2}
.door span{font-size:14px;color:var(--ink-2)}
.door .go{margin-left:auto;color:var(--ink-2)}
.opt-big{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;color:var(--ink);width:100%}
.opt-big[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.opt-big .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.opt-big[aria-pressed="true"] .dot{background:var(--acc);color:var(--acc-ink)}
.opt-big b{display:block;font-size:16px}
.opt-big span{font-size:13.5px;color:var(--ink-2)}
.dots{display:flex;gap:6px}
.dots i{height:6px;width:22px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--acc)}
.back{border:0;background:none;display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--ink-2);padding:0;align-self:flex-start}
.spacer{flex:1}

/* journey */
.journey-top{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stepper li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.stepper li::before{content:"";position:absolute;left:13px;top:36px;bottom:-8px;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper .m{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--ink-2);position:relative;z-index:1}
.stepper .done .m{background:var(--acc);color:var(--acc-ink)}
.stepper .cur .m{background:var(--surface);color:var(--acc-text);box-shadow:0 0 0 2.5px var(--acc)}
.stepper .m .ico{width:15px;height:15px;stroke-width:3;vertical-align:0}
.stepper b{display:block;font-size:15px}
.stepper small{font-size:13px;color:var(--ink-2)}
.stepper .done b{color:var(--ink-2)}

/* pitch / investor cards */
.poster{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#FFFFFF}
.poster .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#0C2630}
.poster .play svg{width:20px;height:20px;fill:currentColor;margin-left:3px}
.poster .dur{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:800}
.poster .sample{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.4);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.poster .ini{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.icard{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:10px 10px 14px;color:var(--ink)}
.icard:hover{box-shadow:var(--shadow)}
.icard .body{display:flex;flex-direction:column;gap:8px;padding:0 6px}
.icard h3{font-size:18px;font-weight:700}
.ret{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--acc-text);font-variant-numeric:tabular-nums}
.score-ring{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.score-ring i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--acc-soft);color:var(--acc-text);border:2px solid var(--acc)}
.proof{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.proof:last-child{border-bottom:0}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.mk.yes{background:var(--good-soft);color:var(--good)}
.mk.no{background:var(--surface-2);color:var(--ink-2)}
.mk .ico{width:14px;height:14px;stroke-width:3;vertical-align:0}
.outcome{background:var(--acc-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.outcome .big{color:var(--acc-text)}
.risk{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.risk i{height:8px;border-radius:4px;background:var(--surface-2)}
.risk i.on{background:var(--acc)}
.uses{display:flex;flex-direction:column;gap:10px}
.use{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14.5px}
.use .bar{grid-column:1/-1;height:6px}
.qa{border-left:3px solid var(--acc-soft);padding-left:12px;display:flex;flex-direction:column;gap:3px}
.mentor{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#FFFFFF;flex:none;font-size:17px}
.list{display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--line);border-radius:18px;padding:14px;background:var(--surface)}
.toggle.on{border-color:var(--acc)}
.toggle-head{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.toggle-head b{display:block;font-size:16px}
.toggle-head span{font-size:13.5px;color:var(--ink-2)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s;display:inline-block}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.on>.toggle-head .switch,.switch.on{background:var(--acc)}
.on>.toggle-head .switch::after,.switch.on::after{transform:translateX(18px)}
.sub-lbl{font-size:13px;font-weight:700;color:var(--ink-2)}

.timeline{display:flex;flex-direction:column;gap:10px}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .f{display:grid;grid-template-columns:118px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:14px}
.funnel .bar{height:14px;border-radius:7px}

/* sheets, toast */
.sheet{position:absolute;inset:0;z-index:40;background:rgba(3,18,24,.5);display:flex;align-items:flex-end}
.sheet-panel{background:var(--bg);width:100%;max-height:94%;overflow-y:auto;border-radius:26px 26px 0 0;display:flex;flex-direction:column}
.sheet-panel.full{max-height:100%;height:100%;border-radius:0}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head b{flex:1;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-foot{position:sticky;bottom:0;padding:12px 16px 14px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.consent input{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex:none}
.done-mark{width:84px;height:84px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin:12px auto 0}
.done-mark .ico{width:42px;height:42px;stroke-width:3}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);text-align:center}

details.acc-card summary{font-weight:800;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.acc-card summary::-webkit-details-marker{display:none}
details.acc-card[open] summary{margin-bottom:8px}
details.acc-card p{color:var(--ink-2);font-size:14.5px}

const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const lakh = n => n >= 100000 ? '₹' + (+(n/100000).toFixed(2)) + 'L' : inr(n);
const emiPay = (A, rate, n) => { const r = rate/1200; return A*r/(1 - Math.pow(1+r, -n)); };
function annualFromAnnuity(A, p, n){ if (p*n <= A) return 0; let lo = 1e-7, hi = 1;
  for (let k = 0; k < 120; k++){ const m = (lo+hi)/2; const pv = p*(1 - Math.pow(1+m, -n))/m; if (pv > A) lo = m; else hi = m; } return (Math.pow(1+lo, 12) - 1)*100; }
function opt(o, A){
  if (o.type === 'emi') return {label:'Monthly repayment', short:`${o.rate}% a year for ${o.months} months`, rate:o.rate};
  if (o.type === 'rev') { const p = o.share/100*o.sales, n = o.cap*A/p; return {label:'Share of sales', short:`${o.share}% of sales until ${o.cap}× is paid back`, rate:annualFromAnnuity(A, p, n)}; }
  if (o.type === 'lump') return {label:'Pay back later', short:`${inr(o.back)} in one go after ${o.months} months`, rate:(Math.pow(o.back/A, 12/o.months) - 1)*100};
  if (o.type === 'equity') return {label:'Ownership', short:`${o.stake}% of the company for the full amount`, rate:null};
  if (o.type === 'partner') return {label:'Partnership', short:`${o.stake}% of profits for the full amount`, rate:null};
  return {label:'Guidance only', short:o.note || 'Mentoring, no money', rate:null};
}

  if (o.type === 'emi'){ const m = emiPay(a, o.rate, o.months); return {head:`${inr(m)} a month`, line:`for ${o.months} months · ${inr(m*o.months)} back in total`}; }
  if (o.type === 'rev'){ const m = a/A*o.share/100*o.sales; return {head:`about ${inr(m)} a month`, line:`more in good months, less in slow ones · until ${inr(a*o.cap)} is paid back (about ${Math.ceil(o.cap*A/(o.share/100*o.sales))} months)`}; }
  if (o.type === 'lump') return {head:`${inr(a*o.back/A)} back`, line:`in one payment after ${o.months} months`};
  if (o.type === 'equity') return {head:`${(o.stake*a/A).toFixed(2)}% ownership`, line:'of the company · its value grows or falls with the business'};

  return {head:'—', line:''};
}

/* ---------- helper apps ---------- */
function helpRequests(){
  const earn = S.accepted.length * S.mentor.price;
  const open = REQUESTS.map((r,i) => ({...r, i})).filter(r => !S.accepted.includes(r.i) && !S.declined.includes(r.i));
  return `<div class="hello"><span class="eyebrow">${t('t_requests')}</span><h1 class="h1">People asking for your help</h1></div>
    <div class="kpis"><div class="kpi"><b>${inr(earn*0.8)}</b><span>You earn</span></div><div class="kpi"><b>${S.accepted.length}</b><span>Calls booked</span></div><div class="kpi"><b>4.9</b><span>Rating (sample)</span></div></div>
    ${open.length ? open.map(r => `<div class="card"><div class="row between"><b>${r.who}</b><span class="tag">${r.when}</span></div><span class="muted" style="font-size:14px">${r.biz}</span><p>“${r.q}”</p>
      <div class="row"><button class="btn primary sm" data-act="accept" data-arg="${r.i}">Accept · ${S.mentor.price ? inr(S.mentor.price) : 'free'}</button><button class="btn ghost sm" data-act="decline" data-arg="${r.i}">Not now</button></div></div>`).join('')
      : `<div class="card"><b>All caught up.</b><span class="muted">New requests show up here.</span></div>`}
    ${S.accepted.length ? `<h2 class="h2">Upcoming calls</h2>` + S.accepted.map(i => `<div class="card flat"><div class="row between"><b>${REQUESTS[i].who}</b><span class="tag acc">Tomorrow, 6 pm</span></div><span class="muted" style="font-size:14px">${REQUESTS[i].q}</span></div>`).join('') : ''}
    <p class="note">You keep 80% of each paid call. Calls happen inside the app and are recorded for safety.</p>`;
}
function helpProfile(){
  const m = S.mentor;
  const tog = (key, val) => `<button class="chip" data-act="mToggle" data-arg="${key}|${val}" aria-pressed="${m[key].includes(val)}">${val}</button>`;
  return `<div class="hello"><span class="eyebrow">${t('t_profile')}</span><h1 class="h1">Your mentor profile</h1><p class="muted">This is what business owners see.</p></div>
    <div class="card"><div class="mentor"><span class="avatar" style="background:var(--acc);color:var(--acc-ink)">Y</span><div><b>You</b><div class="muted" style="font-size:13.5px">${m.topics.join(' · ') || 'Pick your topics'}</div></div></div>
      <div class="row between"><span class="muted" style="font-size:13.5px">${m.langs.join(', ') || 'Pick languages'}</span><b>${m.price ? inr(m.price) + ' / 30 min' : 'Free'}</b></div>${m.live ? '<span class="tag good" style="align-self:flex-start">Published</span>' : ''}</div>
    <div class="field"><span class="lbl">Your price for 30 minutes</span><div class="wrap-row">${[0,199,299,499].map(v => `<button class="chip" data-act="mPrice" data-arg="${v}" aria-pressed="${m.price===v}">${v ? inr(v) : 'Free'}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Topics</span><div class="wrap-row">${['Franchise and retail','Food','Loans','GST and legal','Marketing','Startups'].map(v => tog('topics', v)).join('')}</div></div>
    <div class="field"><span class="lbl">Languages</span><div class="wrap-row">${['Telugu','Hindi','English','Tamil','Urdu'].map(v => tog('langs', v)).join('')}</div></div>
    <button class="btn primary block" data-act="mPublish">${m.live ? 'Update my profile' : 'Publish my profile'}</button>`;
}
function helpPipeline(){
  const lender = S.sub === 'lender';
  const steps = lender ? [['Graduating soon',38],['6 months of sales',21],['Applied to you',9],['Loans given',4]] : [['Interested',46],['Verified',18],['Funded',7],['Opened',3]];
  return `<div class="hello"><span class="eyebrow">${t('t_pipeline')}</span><h1 class="h1">${lender ? 'Ready borrowers' : 'Your future franchisees'}</h1><p class="muted">${lender ? 'Businesses with 6 months of real sales on Fish Tank.' : 'Verified people who want to open your format.'}</p><span class="tag warn" style="align-self:flex-start">Example data</span></div>
    <div class="card"><div class="funnel">${steps.map(([l,n]) => `<div class="f"><span>${l}</span><div class="bar"><i style="width:${Math.round(n/steps[0][1]*100)}%"></i></div><b class="tnum">${n}</b></div>`).join('')}</div></div>
    <h2 class="h2">${lender ? 'Top borrowers' : 'Top candidates'}</h2>
    ${CANDIDATES.map((c,i) => `<div class="card"><div class="row between"><div><b>${c.name}</b><div class="muted" style="font-size:13.5px">${c.city} · ${lender ? '6 months on Fish Tank' : 'Own money ' + c.own}</div></div>${scoreRing(c.score)}</div>
      <div class="row between"><span class="tag">${lender ? 'Repaid on time' : c.stage}</span><button class="btn ${S.shortlist.includes(i) ? 'primary' : 'soft'} sm" data-act="shortlist" data-arg="${i}">${S.shortlist.includes(i) ? 'Shortlisted' : 'Shortlist'}</button></div></div>`).join('')}
    <p class="note">${lender ? 'You pay a small fee only for borrowers you lend to.' : 'You pay only when a franchisee opens their outlet.'}</p>`;
}
function helpListing(){
  const l = S.listing, lender = S.sub === 'lender';
  return `<div class="hello"><span class="eyebrow">${t('t_listing')}</span><h1 class="h1">${lender ? 'Your loan product' : 'Your franchise listing'}</h1><p class="muted">Business owners see this in Help and on their journey.</p></div>
    <div class="field"><label for="l-name">${lender ? 'Lender name' : 'Brand name'}</label><input class="input" id="l-name" data-lbind="name" value="${esc(l.name)}" placeholder="${lender ? 'e.g. Your NBFC' : 'e.g. Your brand'}"></div>
    <div class="field"><label for="l-cost">${lender ? 'Loan range' : 'Setup cost'}</label><input class="input" id="l-cost" data-lbind="cost" value="${esc(l.cost)}" placeholder="${lender ? 'e.g. ₹2–10 lakh' : 'e.g. ₹3–6 lakh'}"></div>
    <div class="field"><label for="l-sup">${lender ? 'Who can apply' : 'What you give franchisees'}</label><textarea class="input" id="l-sup" data-lbind="support" placeholder="${lender ? 'e.g. 6 months of UPI sales, Fish Score 75+' : 'e.g. Training, stock at cost, marketing'}">${esc(l.support)}</textarea></div>
    <button class="btn primary block" data-act="lPublish">${l.live ? 'Update listing' : 'Publish listing (demo)'}</button>`;
}

/* ---------- me (all) ---------- */
function meScreen(){
  const nm = S.explore ? t('m_look') : S.mode === 'biz' ? t('m_biz') : S.mode === 'inv' ? t('m_inv') : t('m_' + S.sub);
  const others = [['biz','store','Get money or help for a business'],['inv','coins','Invest in businesses'],['help','cap','Mentor or partner']].filter(x => x[0] !== S.mode || S.explore);
  return `<div class="card"><div class="mentor"><span class="avatar" style="background:var(--acc);color:var(--acc-ink)">Y</span><div><b style="font-size:18px">You</b><div class="muted">${nm} account</div></div></div>
    <div class="row between"><span>${isVerified() ? 'Verified' : 'Not verified yet'}</span>${isVerified() ? `<span class="tag good">${ic('check')} Done</span>` : `<button class="btn primary sm" data-act="openVerify">Verify</button>`}</div></div>
    <div class="card"><b>Language</b><div class="wrap-row">${[['en','English'],['hi','हिंदी'],['te','తెలుగు']].map(([c,l]) => `<button class="chip" data-act="lang" data-arg="${c}" aria-pressed="${S.lang===c}">${l}</button>`).join('')}</div>${S.lang !== 'en' ? `<p class="muted" style="font-size:13px">${t('lang_note')}</p>` : ''}</div>
    <div class="card"><b>Also use Fish Tank to…</b>${others.map(([m,i,l]) => `<button class="opt-big" data-act="door" data-arg="${m}"><span class="dot">${ic(i)}</span><span><b>${l}</b></span></button>`).join('')}</div>
    <div class="card"><b>Safety</b>
      <div class="row between"><span>Hide my phone number until a deal is signed</span><span class="switch on" aria-hidden="true"></span></div>
      <div class="row between"><span>Only women can message me</span><button class="switch${S.womenOnly ? ' on' : ''}" style="border:0" data-act="womenOnly" aria-pressed="${S.womenOnly}" aria-label="Only women can message me"></button></div>
      <details class="acc-card" style="padding:12px 0 0;border:0"><summary>${ic('shield')} The 3 safety rules</summary><p>1. Everyone is ID-verified. 2. Money goes through a licensed partner straight to sellers, never as cash. 3. Nobody ever pays anyone outside the app; anyone who asks is banned.</p></details></div>
    <button class="btn ghost block" data-act="reset">${ic('refresh')} Restart the demo</button>`;
}

/* ---------- shell ---------- */
const TABS = {
  biz:[['home','t_home','home'],['pitch','t_pitch','pitch'],['help','t_help','help'],['me','t_me','user']],
  inv:[['discover','t_discover','compass'],['portfolio','t_portfolio','wallet'],['learn','t_learn','book'],['me','t_me','user']],
  look:[['discover','t_discover','compass'],['learn','t_learn','book'],['me','t_me','user']],
  mentor:[['requests','t_requests','inbox'],['profile','t_profile','card'],['me','t_me','user']],
  partner:[['pipeline','t_pipeline','funnel'],['listing','t_listing','store'],['me','t_me','user']]
};
const tabSet = () => S.mode === 'biz' ? TABS.biz : S.mode === 'inv' ? (S.explore ? TABS.look : TABS.inv) : S.sub === 'mentor' ? TABS.mentor : TABS.partner;
function screenHTML(){
  const tb = S.tab;
  if (tb === 'me') return meScreen();
  if (S.mode === 'biz') return tb === 'pitch' ? bizPitch() : tb === 'help' ? bizHelp() : bizHome();
  if (S.mode === 'inv') return tb === 'portfolio' ? invPortfolio() : tb === 'learn' ? invLearn() : invDiscover();
  if (S.sub === 'mentor') return tb === 'profile' ? helpProfile() : helpRequests();
  return tb === 'listing' ? helpListing() : helpPipeline();
}
function verifySheet(){ return `<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Verify"><div class="sheet-head"><b>Verify yourself</b><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="sheet-body"><div class="list">${verifyRows()}</div><button class="btn primary block" data-act="close">${isVerified() ? 'Done' : 'Close'}</button></div></div>`; }
function bookSheet(){ const m = MENTORS.find(x => x.id === UI.sheet.id); const slots = ['Today, 6 pm','Tomorrow, 11 am','Tomorrow, 7:30 pm','Saturday, 10 am']; const sel = UI.sheet.slot || slots[0];
  if (UI.sheet.done) return `<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Booked"><div class="sheet-body" style="text-align:center;align-items:center"><span class="done-mark">${ic('check')}</span><h1 class="h1">Call booked</h1><p class="muted">${m.name} · ${sel}. The video call happens inside Fish Tank. You pay only after the call.</p><button class="btn primary block" data-act="close">Done</button></div></div>`;
  return `<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Book a call"><div class="sheet-head"><b>Book ${m.name}</b><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="sheet-body"><p class="muted">${m.head} · ${m.price ? inr(m.price) + ' for 30 minutes' : 'First call free'}</p>
    <div class="field"><span class="lbl">Pick a time</span><div class="wrap-row">${slots.map(s => `<button class="chip" data-act="slot" data-arg="${s}" aria-pressed="${s===sel}">${s}</button>`).join('')}</div></div>
    <div class="field"><label for="bk-q">What do you want to ask?</label><textarea class="input" id="bk-q" placeholder="e.g. Is my shop spot good for a dairy parlour?"></textarea></div>
    <button class="btn primary block" data-act="confirmBook">Book this call (demo)</button></div></div>`; }
function render(keepScroll){
  const app = document.getElementById('app');
  const prev = app.querySelector('.screen, .onb'); const y = prev ? prev.scrollTop : 0;
  app.dataset.mode = (S.onb === 'splash' || S.onb === 'door' || !S.mode) ? 'biz' : S.mode;
  document.documentElement.lang = S.lang;
  let html;
  if (S.onb === 'splash') html = onbSplash();
  else if (S.onb === 'door') html = onbDoor();
  else if (S.onb === 'setup') html = onbSetup();
  else if (S.onb === 'verify') html = onbVerify();
  else {
    const tabs = tabSet(); if (!tabs.some(x => x[0] === S.tab)) S.tab = tabs[0][0];
    const pill = S.explore ? t('m_look') : S.mode === 'biz' ? t('m_biz') : S.mode === 'inv' ? t('m_inv') : t('m_' + S.sub);
    const building = S.build && S.mode === 'biz' && S.tab === 'pitch';
    html = `<header class="appbar"><span class="logo">${FISH('var(--acc)','var(--gold)','#0C2630')} Fish Tank</span><span class="mode-pill">${pill}</span><span class="sp"></span>
        <button class="icon-btn" data-act="toast" data-arg="No new notifications." aria-label="Notifications">${ic('bell')}</button></header>
      <div class="screen" id="screen">${screenHTML()}</div>
      ${building ? '' : `<nav class="tabbar" style="grid-template-columns:repeat(${tabs.length},1fr)" aria-label="Main">${tabs.map(([id,k,i]) => `<button data-act="tab" data-arg="${id}"${S.tab===id?' aria-current="page"':''}>${ic(i)}<span>${t(k)}</span></button>`).join('')}</nav>`}`;
  }
  if (UI.sheet){ const k = UI.sheet.kind; const inner = k === 'detail' ? detailSheet() : k === 'invest' ? investSheet() : k === 'verify' ? verifySheet() : bookSheet();
    html += `<div class="sheet" data-act="backdrop">${inner}</div>`; }
  html += `<div class="toast" id="toast" role="status" hidden></div>`;
  app.innerHTML = html;
  const sc = app.querySelector('.screen, .onb'); if (sc && keepScroll) sc.scrollTop = y;
  renderPresenter();
  showToast();
}

/* ---------- actions ---------- */
const A = {
  lang:v => { S.lang = v; },
  goto:v => { S.onb = v; UI.sheet = null; },
  door:v => { UI.sheet = null; S.build = 0; if (v === 'look'){ S.mode = 'inv'; S.explore = true; S.onb = null; S.tab = 'discover'; return; }
    S.explore = false; S.mode = v; S.sub = null; S.ans = {}; S.onb = 'setup'; },
  ans:v => { const [q,val] = v.split('|'); if (q === 'sub') S.sub = val; else S.ans[q] = val; },
  verify:v => { S.verified[v] = true; },
  finishOnb:() => { S.onb = null; S.tab = tabSet()[0][0]; toast(isVerified() ? 'You’re verified. Welcome to Fish Tank!' : 'Welcome! You can verify any time from Me.'); },
  tab:v => { S.tab = v; S.build = 0; },
  toast:v => { toast(v); return 'nore'; },
  openVerify:() => { UI.sheet = {kind:'verify'}; },
  close:() => { UI.sheet = null; },
  backdrop:() => { UI.sheet = null; },
  startBuild:() => { S.tab = 'pitch'; if (!S.pitch) S.pitch = newPitch(); S.build = 1; },
  editProof:() => { S.tab = 'pitch'; if (!S.pitch) S.pitch = newPitch(); S.build = 4; },
  tabPitch:() => { S.tab = 'pitch'; },
  bStep:v => { S.build = Math.max(0, Math.min(5, +v)); },
  bSet:v => { const [k,val] = v.split('|'); S.pitch[k] = k === 'amount' ? +val : val; if (k === 'amount' && +val === 0) S.pitch.opts.guide.on = true; },
  bOpt:v => { S.pitch.opts[v].on = !S.pitch.opts[v].on; },
  bOptSet:v => { const [path,val] = v.split('|'); const [o,f] = path.split('.'); S.pitch.opts[o][f] = +val; },
  bProof:v => { S.pitch.proofs[v] = !S.pitch.proofs[v]; },
  recVideo:() => { S.pitch.video = true; toast('Video recorded (demo).'); },
  submitPitch:() => { S.pitch.status = 'review'; S.build = 0; toast('Sent for review. We’ll call you tomorrow.'); },
  goLive:() => { const p = S.pitch; p.status = 'live'; p.views = 214; p.interested = 9; p.raised = Math.round(p.amount*0.18/1000)*1000; toast('Your pitch is live for investors!'); },
  simDay:() => { const p = S.pitch; p.views += 96; p.interested += 4; p.raised = Math.min(p.amount, p.raised + Math.round(p.amount*0.21/1000)*1000); toast(p.raised >= p.amount ? 'Goal reached! Money now goes to your sellers in stages.' : 'A day passed: more views and new investors.'); },
  helpSeg:v => { S.helpSeg = v; S.tab = 'help'; },
  book:v => { UI.sheet = {kind:'book', id:v}; },
  slot:v => { UI.sheet.slot = v; },
  confirmBook:() => { UI.sheet.done = true; S.bookings.push(UI.sheet.id); },
  invFilter:v => { S.invFilter = v; },
  open:v => { UI.sheet = {kind:'detail', id:v, o:0}; },
  none:() => 'nore',
  pickOpt:v => { UI.sheet.o = +v; },
  investStart:() => { UI.sheet = {kind:'invest', id:UI.sheet.id, o:UI.sheet.o || 0, amt:10000, step:'amount'}; },
  backToDetail:() => { UI.sheet = {kind:'detail', id:UI.sheet.id, o:UI.sheet.o}; },
  amt:v => { UI.sheet.amt = +v; },
  confirmInvest:() => { const v = UI.sheet; const p = PITCHES.find(x => x.id === v.id); S.offers.push({pid:v.id, amount:v.amt, o:v.o || 0}); p.raised = Math.min(p.ask, p.raised + v.amt); p.backers++; v.step = 'done'; },
  toPortfolio:() => { UI.sheet = null; S.tab = 'portfolio'; },
  accept:v => { S.accepted.push(+v); toast('Accepted. The call is in your calendar.'); },
  decline:v => { S.declined.push(+v); },
  mPrice:v => { S.mentor.price = +v; },
  mToggle:v => { const [k,val] = v.split('|'); const a = S.mentor[k]; S.mentor[k] = a.includes(val) ? a.filter(x => x !== val) : [...a, val]; },
  mPublish:() => { S.mentor.live = true; toast('Profile published (demo). Business owners can book you now.'); },
  shortlist:v => { const i = +v; S.shortlist = S.shortlist.includes(i) ? S.shortlist.filter(x => x !== i) : [...S.shortlist, i]; },
  lPublish:() => { S.listing.live = true; toast('Listing published (demo).'); },
  womenOnly:() => { S.womenOnly = !S.womenOnly; toast(S.womenOnly ? 'Only women can message you now.' : 'Every verified user can message you.'); },
  restart:() => { UI.sheet = null; S.onb = 'splash'; },
  reset:() => { try{ localStorage.removeItem('fishtank-v2'); }catch(e){} for (const k of Object.keys(S)) delete S[k]; Object.assign(S, JSON.parse(JSON.stringify(DEFAULTS))); UI.sheet = null; },
  preview:v => { const [m,sub] = v.split('|'); UI.sheet = null; S.build = 0; S.onb = null; S.explore = false; S.mode = m; S.sub = sub || null;
    if (m === 'biz' && !S.ans.need) S.ans.need = 'Both'; ['aadhaar','selfie','bank'].forEach(k => { S.verified[k] = true; }); S.tab = tabSet()[0][0]; }
};
const RESET_SCROLL = ['tab','goto','door','finishOnb','preview','restart','reset','startBuild','editProof','bStep','helpSeg','toPortfolio','tabPitch','submitPitch'];
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'backdrop' && e.target !== el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  const r = fn(el.dataset.arg); if (r === 'nore') return;
  save(); render(!RESET_SCROLL.includes(el.dataset.act));
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && S.pitch){ const k = el.dataset.bind; S.pitch[k] = k === 'amount' ? Math.max(0, +el.value || 0) : el.value; save();
    if (k === 'title'){ const btn = document.querySelector('.screen > .btn.primary.block'); const empty = !el.value.trim();
      if (btn && btn.disabled !== empty){ render(true); const n = document.getElementById('b-title'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
    return; }
  if (el.dataset.lbind){ S.listing[el.dataset.lbind] = el.value; save(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'p-lang'){ S.lang = el.value; save(); render(true); return; }
  if (el.dataset.bind === 'amount'){ render(true); return; }
  if ((el.id === 'c1' || el.id === 'c2') && UI.sheet){ UI.sheet[el.id] = el.checked; render(true); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form; const inp = e.target.querySelector('input');
  if (!inp || !inp.value.trim()){ toast('Type something first.'); return; }
  inp.value = ''; toast(f === 'reply' ? 'Answer posted (demo). Investors can see it.' : 'Question sent (demo). The owner answers in public.');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet){ UI.sheet = null; render(true); } });

load();
render();
</script>
</body>
</html>
