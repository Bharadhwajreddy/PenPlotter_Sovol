<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fish Tank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* Layout: an app shell — sticky top bar, one content column (max 1120px), bottom tab bar on phones. Water + goldfish palette. */
:root{
  --bg:#EEF4F3; --surface:#FFFFFF; --surface-2:#E2EDEB; --ink:#0B2A33; --ink-2:#47636C; --line:#CFDEDB;
  --water:#0E6F69; --water-hover:#0B5C57; --water-ink:#FFFFFF; --water-soft:#D3ECE8; --water-text:#0B5C57;
  --gold:#E8890C; --gold-soft:#FCE9CF; --gold-text:#8A4B00;
  --good:#17803D; --good-soft:#DCF2E3; --warn:#A85A00; --bad:#B42318; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(11,42,51,.06),0 8px 24px rgba(11,42,51,.07);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans Devanagari","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06191F; --surface:#0C252D; --surface-2:#11323C; --ink:#E4F1F0; --ink-2:#9BB8BE; --line:#1D4350;
  --water:#2BB3A7; --water-hover:#3CC7BA; --water-ink:#03201D; --water-soft:#0F3A39; --water-text:#6FD6CB;
  --gold:#F5A524; --gold-soft:#3A2A0E; --gold-text:#FFC874;
  --good:#4ADE80; --good-soft:#0E3320; --warn:#FBBF24; --bad:#F87171; --bad-soft:#3B1412;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06191F; --surface:#0C252D; --surface-2:#11323C; --ink:#E4F1F0; --ink-2:#9BB8BE; --line:#1D4350;
  --water:#2BB3A7; --water-hover:#3CC7BA; --water-ink:#03201D; --water-soft:#0F3A39; --water-text:#6FD6CB;
  --gold:#F5A524; --gold-soft:#3A2A0E; --gold-text:#FFC874;
  --good:#4ADE80; --good-soft:#0E3320; --warn:#FBBF24; --bad:#F87171; --bad-soft:#3B1412;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--water-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--water-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:21px}
.brand svg{width:32px;height:32px}
.topnav{display:flex;gap:4px;margin-left:12px}
.topnav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px}
.topnav a:hover{background:var(--surface-2);color:var(--ink)}
.topnav a[aria-current="page"]{background:var(--water-soft);color:var(--water-text)}
.top-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.select{appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 30px 7px 12px;font-size:14px;font-weight:600;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ribbon{background:var(--gold-soft);color:var(--gold-text);font-size:13px;font-weight:600}
.ribbon .wrap{padding-block:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{padding-block:28px 120px;min-height:60vh}

/* tab bar (phone) */
.tabbar{display:none}
@media (max-width:820px){
  .topnav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--ink-2);font-size:11.5px;font-weight:600;border-radius:12px;min-width:0}
  .tabbar a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--water-text);background:var(--water-soft)}
  .tabbar a.tab-plus svg{background:var(--water);color:var(--water-ink);border-radius:10px;padding:3px;width:28px;height:28px}
  .hide-sm{display:none!important}
}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--water);color:var(--water-ink)}
.btn-primary:hover{background:var(--water-hover)}
.btn-gold{background:var(--gold);color:#2B1700}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--water)}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--water-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.water{background:var(--water-soft);color:var(--water-text)}
.tag.gold{background:var(--gold-soft);color:var(--gold-text)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card.raised{box-shadow:var(--shadow);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.section{display:flex;flex-direction:column;gap:16px;margin-top:40px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.h-page{font-size:clamp(28px,4vw,40px);font-weight:800}
.h-sec{font-size:22px;font-weight:700}
.lead{font-size:18px;color:var(--ink-2);max-width:62ch}
.note{border-radius:var(--r);padding:12px 14px;background:var(--surface-2);color:var(--ink-2);font-size:14px}
.note.gold{background:var(--gold-soft);color:var(--gold-text)}
.note.water{background:var(--water-soft);color:var(--water-text)}
.divider{height:1px;background:var(--line);border:0;margin:4px 0}
.back-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;color:var(--ink-2);margin-bottom:12px}

/* welcome */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:12px 8px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(38px,6.2vw,68px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{margin-top:16px}
.hero .row{margin-top:24px}
.tank-visual{position:relative;border-radius:28px;padding:22px;background:linear-gradient(170deg,var(--water-soft),var(--surface-2));overflow:hidden;border:1px solid var(--line)}
.bubble{position:absolute;border-radius:50%;border:2px solid var(--water);opacity:.35}
@media (prefers-reduced-motion:no-preference){.bubble{animation:rise 9s linear infinite}
  @keyframes rise{from{transform:translateY(30px)}to{transform:translateY(-40px)}}}
.lang-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;align-items:center}
.steps-line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
@media (max-width:760px){.steps-line{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px}
.step-tile b{font-family:var(--f-display);font-size:19px}
.step-num{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:15px}

/* role picker */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.role{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;cursor:pointer;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.role:hover{border-color:var(--water);box-shadow:var(--shadow)}
.role[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}
.role .ico-wrap{width:44px;height:44px;border-radius:12px;background:var(--water-soft);color:var(--water-text);display:grid;place-items:center;flex:none}
.role[aria-pressed="true"] .ico-wrap{background:var(--water);color:var(--water-ink)}
.role .ico-wrap .ico{width:24px;height:24px}
.role b{display:block;font-size:17px;font-family:var(--f-display);font-weight:700}
.role span{font-size:14px;color:var(--ink-2)}
.q-block{display:flex;flex-direction:column;gap:10px}
.q-block h3{font-size:19px;font-family:var(--f-body);font-weight:700}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.progress-dots i.on{background:var(--water)}

/* home */
.home-head{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.checklist{display:flex;flex-direction:column;gap:10px}
.check-item{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.check-box{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;cursor:pointer;background:transparent;color:var(--water-ink)}
.check-box[aria-checked="true"]{background:var(--water);border-color:var(--water)}
.check-box .ico{width:16px;height:16px;stroke-width:3}
.check-item .txt{flex:1;min-width:0}
.check-item .txt b{display:block}
.check-item .txt small{color:var(--ink-2);font-size:14px}
.check-item.done .txt b{text-decoration:line-through;color:var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--water);border-radius:4px}
.bar.gold>i{background:var(--gold)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:13.5px;color:var(--ink-2)}

/* pitch cards */
.pitch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pitch{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:var(--ink);transition:box-shadow .15s,transform .15s}
.pitch:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.poster{position:relative;aspect-ratio:16/10;max-width:100%;display:flex;align-items:flex-end;padding:14px;color:#FFFFFF}
.poster .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#0B2A33}
.poster .play svg{width:22px;height:22px;fill:currentColor;stroke:none;margin-left:3px}
.poster .dur{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.poster .sample{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.poster .initials{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.pitch-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.pitch-body h3{font-size:18px;font-weight:700}
.pitch-meta{font-size:13.5px;color:var(--ink-2)}
.pitch-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px 3px 4px;background:var(--gold-soft);color:var(--gold-text)}
.score i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2B1700;font-style:normal;font-size:11px}

/* pitch detail */
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.poster.big{aspect-ratio:16/9;border-radius:var(--r-lg)}
.poster.big .play{width:72px;height:72px}
.opt{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
button.opt{text-align:left;cursor:pointer;width:100%}
button.opt[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}
.opt-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opt-top b{font-size:15.5px}
.rate{font-weight:800;color:var(--water-text);white-space:nowrap;font-variant-numeric:tabular-nums}
.proof{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.proof:last-child{border-bottom:0}
.proof .mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.proof .mark.yes{background:var(--good-soft);color:var(--good)}
.proof .mark.no{background:var(--surface-2);color:var(--ink-2)}
.proof .mark .ico{width:14px;height:14px;stroke-width:3}
.uses{display:flex;flex-direction:column;gap:8px}
.use-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14.5px}
.use-row .bar{grid-column:1/-1;height:6px}
.qa{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:4px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(4,20,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet-panel{background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:24px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.icon-btn{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--water)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14.5px}
.field .hint{font-size:13px;color:var(--ink-2)}
.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.input:focus{border-color:var(--water);outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.consent input{width:20px;height:20px;accent-color:var(--water);margin-top:2px;flex:none}
.big-num{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz-steps{display:flex;gap:6px;flex-wrap:wrap}
.wiz-steps button{border:0;background:var(--surface-2);color:var(--ink-2);padding:7px 12px;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer}
.wiz-steps button[aria-current="step"]{background:var(--water);color:var(--water-ink)}
.toggle-card{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.toggle-card.on{border-color:var(--water)}
.toggle-head{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggle-head input{width:20px;height:20px;accent-color:var(--water)}
.mini-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini-fields .input{padding:9px 11px}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14.5px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.src{font-size:13px;color:var(--ink-2)}
.fact{display:flex;flex-direction:column;gap:8px}
.fact .num{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--water-text);line-height:1}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--water-text);border-bottom-color:var(--water)}

/* ---------- money helpers ---------- */
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const lakh = n => n >= 100000 ? '₹' + (+(n/100000).toFixed(n % 100000 ? 2 : 0)).toString() + 'L' : inr(n);
function emiPayment(A, ratePct, n){ const r = ratePct/1200; return r === 0 ? A/n : A*r/(1 - Math.pow(1+r, -n)); }
function annualFromAnnuity(A, p, n){ // yearly rate implied by paying p a month for n months on A
  if (p*n <= A) return 0; let lo = 1e-7, hi = 1;
  for (let k = 0; k < 120; k++){ const m = (lo+hi)/2; const pv = p*(1 - Math.pow(1+m, -n))/m; if (pv > A) lo = m; else hi = m; }
  return (Math.pow(1+lo, 12) - 1)*100;
}
function optInfo(o, A){
  if (o.type === 'emi'){ const p = emiPayment(A, o.rate, o.months); return {label:'Loan with monthly EMI', terms:`${o.rate}% a year · ${o.months} months`, rate:o.rate, total:p*o.months, note:`EMI about ${inr(p)} a month`}; }
  if (o.type === 'rev'){ const p = o.share/100*o.sales; const n = o.cap*A/p; return {label:'Share of sales', terms:`${o.share}% of monthly sales until ${o.cap}× is repaid`, rate:annualFromAnnuity(A, p, n), total:o.cap*A, note:`Paid back in about ${Math.ceil(n)} months if sales are ${lakh(o.sales)} a month`}; }
  if (o.type === 'lump'){ return {label:'Pay back later', terms:`${inr(o.back)} in one go after ${o.months} months`, rate:(Math.pow(o.back/A, 12/o.months) - 1)*100, total:o.back, note:o.months > 36 ? 'Over 36 months: offered as a partnership, not a loan' : 'Nothing to pay each month'}; }
  if (o.type === 'partner') return {label:'Partnership', terms:`${o.stake}% of profits for the full amount`, rate:null, note:'Done with a partnership deed'};
  if (o.type === 'equity') return {label:'Ownership (shares)', terms:`${o.stake}% of the company for the full amount`, rate:null, note:'Shown to verified investors only'};
  return {label:'Guidance only', terms:o.note || 'Mentoring, no money', rate:null, note:'Matched with mentors'};
}

/* ---------- pieces ---------- */
function poster(p, big){
  const [a,b] = p.hue.split(',');
  const ini = p.who.split(' ').filter(w => /^[A-Z]/.test(w)).slice(0,2).map(w => w[0]).join('');
  return `<div class="poster${big?' big':''}" style="background:linear-gradient(150deg,${a},${b})">
    <span class="sample">Sample</span><span class="dur">${p.dur}</span><span class="play">${PLAY}</span><span class="initials">${ini}</span></div>`;
}
function scoreBadge(s){ return `<span class="score" title="Fish Score"><i>${s}</i>Fish Score</span>`; }
function pitchCard(p){
  const pct = p.ask ? Math.min(100, Math.round(p.raised/p.ask*100)) : 0;
  const deals = [...new Set(p.options.map(o => optInfo(o, p.ask || 1).label))];
  return `<a class="pitch" href="#pitch-${p.id}">
    ${poster(p)}
    <div class="pitch-body">
      <div class="pitch-meta">${ic('pin','')} ${p.city} · ${p.type}</div>
      <h3>${p.title}</h3>
      <div class="pitch-meta">${p.who}</div>
      ${p.ask ? `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><b class="tnum">${lakh(p.raised)} <span class="muted" style="font-weight:500">of ${lakh(p.ask)}</span></b><span class="muted tnum">${pct}% ${t('funded')}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`
              : `<div class="note water" style="padding:8px 12px">Has the money. Needs a mentor.</div>`}
      <div class="chips">${deals.map(d => `<span class="tag water">${d}</span>`).join('')}</div>
      <div class="pitch-foot">${scoreBadge(p.score)}<span class="muted" style="font-size:13px">${p.backers ? p.backers + ' backers' : 'Open to mentors'}</span></div>
    </div></a>`;
}
function proofList(pr){
  const rows = [['format','Proven format or track record'],['circle','Own circle backed first'],['demand','Real local demand'],['mentor','Operator mentor on board']];
  return rows.map(([k,l]) => `<div class="proof"><span class="mark ${pr[k]?'yes':'no'}">${pr[k]?ic('check'):ic('x')}</span><div><b>${l}</b><div class="muted" style="font-size:14px">${pr[k] || 'Not yet'}</div></div></div>`).join('');
}
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 3200); }
function openSheet(html){ const s = document.getElementById('sheet'); document.getElementById('sheet-panel').innerHTML = html; s.hidden = false; const f = s.querySelector('button,input,select'); if (f) f.focus(); }
function closeSheet(){ document.getElementById('sheet').hidden = true; }
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

function offerSheet(pid, step, sel, amount){
  const p = pid === 'mine' ? S.myPitch : PITCHES.find(x => x.id === pid);
  const opts = p.options.filter(o => o.type !== 'guide');
  sel = sel ?? 0; const o = opts[sel]; const info = optInfo(o, p.ask);
  const loanLike = o.type === 'emi' || o.type === 'lump' || o.type === 'rev';
  const max = Math.max(5000, Math.min(loanLike ? 50000 : 200000, p.ask - p.raised));
  amount = Math.min(amount || 10000, max);
  const share = amount / p.ask;
  let back = '';
  if (info.total) back = `You could get back about <b class="tnum">${inr(info.total*share)}</b> in total (${rateText(info)}).`;
  else if (o.type === 'partner') back = `You would get about <b class="tnum">${(o.stake*share).toFixed(2)}%</b> of the business’s profits.`;
  else if (o.type === 'equity') back = `You would own about <b class="tnum">${(o.stake*share).toFixed(2)}%</b> of the company.`;
  const head = `<div class="sheet-head"><div><p class="eyebrow">Step ${step} of 3</p><h2 class="h-sec">${p.title}</h2></div><button class="icon-btn" data-close="1" aria-label="Close">${ic('x')}</button></div>`;
  if (step === 1) return head + `<b>Choose how you want to back</b>
    <div class="stack" style="gap:8px">${opts.map((x,i) => { const n = optInfo(x, p.ask); return `<button class="opt" data-pick="${i}" aria-pressed="${i===sel}"><div class="opt-top"><b>${n.label}</b><span class="rate">${rateText(n)}</span></div><span class="muted" style="font-size:14px">${n.terms}</span></button>`; }).join('')}</div>
    <button class="btn btn-primary btn-block" data-step="2" data-sel="${sel}">${t('continue')}</button>`;
  if (step === 2) return head + `<div class="field"><label for="amt">How much?</label><div class="big-num" id="amt-out">${inr(amount)}</div>
      <input type="range" id="amt" min="5000" max="${max}" step="1000" value="${amount}" data-sel="${sel}">
      <span class="hint">${loanLike ? 'RBI rules cap what one person can lend to one borrower at ₹50,000 across P2P platforms.' : 'Partnership and share deals are signed with a lawyer partner.'}</span></div>
    <p class="note water" id="amt-back">${back}</p>
    <div class="row"><button class="btn btn-ghost" data-step="1" data-sel="${sel}">${t('back')}</button><button class="btn btn-primary" style="flex:1" data-step="3" data-sel="${sel}" data-amt="${amount}">${t('continue')}</button></div>`;
  return head + `<div class="card stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="muted">You back</span><b class="tnum">${inr(amount)}</b></div><div class="row" style="justify-content:space-between"><span class="muted">Deal</span><b>${info.label}</b></div><div class="row" style="justify-content:space-between"><span class="muted">Terms</span><b style="text-align:right">${info.terms}</b></div></div>
    <label class="consent"><input type="checkbox" id="c1"> I understand businesses can fail and my money is not guaranteed.</label>
    <label class="consent"><input type="checkbox" id="c2"> I will never send money or favours to anyone outside the app.</label>
    <p class="muted" style="font-size:13.5px">Your money waits in the licensed partner’s escrow. If the business is not fully funded in 30 days, it comes back to you.</p>
    <div class="row"><button class="btn btn-ghost" data-step="2" data-sel="${sel}" data-amt="${amount}">${t('back')}</button><button class="btn btn-primary" style="flex:1" id="confirm-offer" data-pid="${pid}" data-sel="${sel}" data-amt="${amount}" disabled>Confirm (demo)</button></div>`;
}

/* learn */
function schemeMatches(f){
  return SCHEMES.filter(s => {
    if (!s.stages.includes(f.stage)) return false;
    if (s.groups && !s.groups.includes(f.group)) return false;
    if (s.min && f.amount < s.min) return false;
    return f.amount <= s.max;
  });
}

  const tab = S.learnTab;

  if (tab === 'formats') body = `<p class="note gold" style="margin-bottom:16px">Setup costs here are rough sample ranges for the demo. In the real app, partner brands publish verified numbers.</p>

/* ---------- render ---------- */
function render(){
  const r = current();
  shell();
  const app = document.getElementById('app');
  let html;
  if (r.startsWith('pitch-')) html = V.pitch(r.slice(6));
  else html = (V[r] || V.welcome)();
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function rerender(keepScroll){ const y = window.scrollY; const r = current(); shell(); const app = document.getElementById('app'); app.innerHTML = r.startsWith('pitch-') ? V.pitch(r.slice(6)) : (V[r] || V.welcome)(); if (keepScroll) window.scrollTo(0,y); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-role]');
  if (!b) return;
  const d = b.dataset;
  if (d.lang){ S.lang = d.lang; save(); rerender(true); return; }
  if (d.role){ S.role = d.role; S.answers = {}; save(); go('setup'); return; }
  if (d.q){ const q = d.q; if (d.multi === '1'){ const arr = S.answers[q] || []; S.answers[q] = arr.includes(d.val) ? arr.filter(x => x !== d.val) : [...arr, d.val]; } else S.answers[q] = d.val; save(); rerender(true); return; }
  if (d.done){ S.done[d.done] = !S.done[d.done]; save(); rerender(true); if (S.done[d.done]) toast('Nice. One step closer.'); return; }
  if (d.tf){ TF[d.tf] = d.val; rerender(true); return; }
  if (d.resetTank){ Object.assign(TF, {q:'',type:'All',deal:'Any',city:'All'}); rerender(true); return; }
  if (d.offer){ openSheet(offerSheet(d.offer, 1, 0)); return; }
  if (d.mentorOffer){ toast('Mentor offer sent (demo). They will see it in their inbox.'); return; }
  if (d.close){ closeSheet(); return; }
  if (d.toast){ toast(d.toast); return; }
  if (d.book){ openSheet(bookSheet(d.book)); return; }
  if (d.slot){ document.querySelectorAll('#slots .chip').forEach(c => c.setAttribute('aria-pressed', c === b)); return; }
  if (d.confirmBook){ const m = MENTORS.find(x => x.id === d.confirmBook); const slot = document.querySelector('#slots .chip[aria-pressed="true"]').dataset.slot; S.bookings.push({name:m.name, slot}); save(); closeSheet(); toast(`Call booked with ${m.name}, ${slot} (demo).`); if (current()==='me') rerender(true); return; }
  if (d.mf){ MF.tag = d.mf; rerender(true); return; }
  if (d.ltab){ S.learnTab = d.ltab; save(); rerender(true); return; }
  if (d.ff){ S.finder[d.ff] = d.val; save(); rerender(true); return; }
  if (d.startFormat){ S.draft = newDraft(); S.draft.title = d.startFormat; S.draft.type = /franchise/i.test(d.startFormat) ? 'Franchise' : 'Shop'; save(); go('create'); return; }
  if (d.verify){ S.verified[d.verify] = true; if (['id','pan','selfie','bank'].every(k => S.verified[k]) && S.role) { S.done[S.role+':verify'] = true; } save(); rerender(true); toast('Verified (demo).'); return; }
  if (d.wstep){ S.draft.step = +d.wstep; save(); rerender(false); return; }
  if (d.dset){ S.draft[d.dset] = d.val; save(); rerender(true); return; }
  if (b.id === 'publish-pitch'){ const dr = S.draft; S.myPitch = {id:'mine', who:'You', title:dr.title, city:dr.city || 'Your city', type:dr.type, stage:dr.stage, ask:+dr.amount, raised:0, backers:0, score:draftScore(dr), dur:'1:00', hue:'#0E6F69,#0B3F4D',
      story:'Your video and story appear here once our team has reviewed them.', uses:dr.uses.filter(u => u[0] && +u[1]).map(u => [u[0], +u[1]]), options:draftOptions(dr), proofs:{format:dr.proofs.format?'To be checked':null, circle:dr.proofs.circle?'To be checked':null, demand:dr.proofs.demand?'To be checked':null, mentor:dr.proofs.mentor?'To be checked':null}, qa:[]};
    if (S.role) S.done[S.role+':pitch'] = true; save(); toast('Pitch submitted for review (demo).'); go('pitch-mine'); return; }
  if (b.id === 'reset-demo'){ try{ localStorage.removeItem('fishtank-v1'); }catch(err){} location.hash = 'welcome'; location.reload(); return; }
});
/* offer sheet: separate handler that knows the current pitch */
document.getElementById('sheet-panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const panel = document.getElementById('sheet-panel');
  const r = current(); const pid = r.startsWith('pitch-') ? r.slice(6) : null; if (!pid) return;
  if (b.dataset.pick != null){ panel.innerHTML = offerSheet(pid, 1, +b.dataset.pick); return; }
  if (b.dataset.step){ panel.innerHTML = offerSheet(pid, +b.dataset.step, +b.dataset.sel, +(b.dataset.amt || 0) || undefined); return; }
  if (b.id === 'confirm-offer'){ const p = pid === 'mine' ? S.myPitch : PITCHES.find(x => x.id === pid); const o = p.options.filter(x => x.type !== 'guide')[+b.dataset.sel];
    S.offers.push({pid, amount:+b.dataset.amt, label:optInfo(o, p.ask).label}); p.raised = Math.min(p.ask, p.raised + +b.dataset.amt); p.backers++; save(); closeSheet(); toast('Offer placed (demo). Your money would wait in escrow until the business is fully funded.'); rerender(true); }
});
document.getElementById('sheet-panel').addEventListener('input', e => {
  if (e.target.id === 'amt'){ const r = current(); const pid = r.slice(6); const panel = document.getElementById('sheet-panel'); const sel = +e.target.dataset.sel; const v = +e.target.value;
    const html = offerSheet(pid, 2, sel, v); const tmp = document.createElement('div'); tmp.innerHTML = html;
    document.getElementById('amt-out').textContent = inr(v); document.getElementById('amt-back').innerHTML = tmp.querySelector('#amt-back').innerHTML;
    panel.querySelectorAll('[data-step="3"]').forEach(x => x.dataset.amt = v); }
});
document.getElementById('sheet-panel').addEventListener('change', e => {
  if (e.target.id === 'c1' || e.target.id === 'c2'){ const ok = document.getElementById('c1').checked && document.getElementById('c2').checked; document.getElementById('confirm-offer').disabled = !ok; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'tank-q'){ TF.q = el.value; const pos = el.selectionStart; rerender(true); const n = document.getElementById('tank-q'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (el.id === 'ff-amt'){ S.finder.amount = +el.value; document.getElementById('ff-amt-out').textContent = lakh(+el.value); return; }
  if (!S.draft) return;
  if (el.dataset.d){ S.draft[el.dataset.d] = el.type === 'number' ? +el.value : el.value; save(); return; }
  if (el.dataset.use != null){ S.draft.uses[+el.dataset.use][+el.dataset.k] = el.type === 'number' ? +el.value : el.value; save(); return; }
  if (el.dataset.of){ S.draft[el.dataset.of][el.dataset.f] = el.type === 'number' ? +el.value : el.value; save(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'lang-select'){ S.lang = el.value; save(); rerender(true); return; }
  if (el.id === 'role-select'){ if (el.value){ S.role = el.value; save(); go('home'); } return; }
  if (el.id === 'tank-city'){ TF.city = el.value; rerender(true); return; }
  if (el.id === 'ff-amt'){ save(); rerender(true); return; }
  if (el.id === 'women-only'){ toast(el.checked ? 'Only women backers and mentors can message you.' : 'Everyone verified can message you.'); return; }
  if (!S.draft) return;
  if (el.dataset.opt){ S.draft[el.dataset.opt].on = el.checked; save(); rerender(true); return; }
  if (el.dataset.proof){ S.draft.proofs[el.dataset.proof] = el.checked; save(); rerender(true); return; }
  if (el.dataset.d || el.dataset.use != null || el.dataset.of){ rerender(true); return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'ask-form'){ const v = document.getElementById('ask-q').value.trim(); if (!v){ toast('Type a question first.'); return; } document.getElementById('ask-q').value = ''; toast('Question posted (demo). The pitcher answers in public.'); }
  if (e.target.id === 'report-form'){ toast('Report sent (demo). Our safety team replies within 24 hours.'); e.target.reset(); }
});
window.addEventListener('hashchange', render);

load();
render();
</script>
