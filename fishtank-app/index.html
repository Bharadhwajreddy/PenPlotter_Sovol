<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fish Tank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* Fish Tank V3. Presenter panel + phone frame on desktop; the phone app alone, full screen, on phones.
   Each user type is its own app: business = teal water, backer = gold, mentor and partner = plum. */
:root{
  --page:#E4ECEA; --bg:#F5F8F7; --surface:#FFFFFF; --surface-2:#EBF1F0; --ink:#0C2630; --ink-2:#4B6570; --line:#D9E3E1; --line-strong:#869794; --frame:#0C2630;
  --teal:#0E6F69; --teal-soft:#D3EDE9; --teal-text:#0B5C57; --teal-ink:#FFFFFF;
  --gold:#A35F00; --gold-soft:#FBECD6; --gold-text:#8A4F00; --gold-ink:#FFFFFF;
  --plum:#8A3B78; --plum-soft:#F4E3EF; --plum-text:#7A2F69; --plum-ink:#FFFFFF;
  --good:#12692F; --good-soft:#DDF2E4; --warn:#9A3412; --warn-soft:#FDEBDC; --bad:#B42318; --bad-soft:#FBE4E1; --info:#35506B; --info-soft:#E3EBF3;
  --wa-bg:#EFE7DD; --wa-bubble:#D9FDD3; --wa-btn:#1A7F4B; --wa-ink:#FFFFFF;
  --acc:var(--teal); --acc-soft:var(--teal-soft); --acc-text:var(--teal-text); --acc-ink:var(--teal-ink);
  --r-card:20px; --r-inner:14px; --pad:16px;
  --shadow:0 1px 2px rgba(12,38,48,.06),0 10px 30px rgba(12,38,48,.08);
  --f-display:"Bricolage Grotesque","Figtree","Noto Sans Devanagari","Noto Sans Telugu",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans Devanagari","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#03121A; --bg:#071B21; --surface:#0D262E; --surface-2:#133440; --ink:#E3F0EF; --ink-2:#9DB9BF; --line:#1E4350; --line-strong:#5F7F86; --frame:#000000;
  --teal:#34B8AC; --teal-soft:#10393A; --teal-text:#7ADBD0; --teal-ink:#03201D;
  --gold:#F2A93B; --gold-soft:#3A2A10; --gold-text:#FFCB7A; --gold-ink:#2A1700;
  --plum:#D07CC0; --plum-soft:#3A1A33; --plum-text:#F0B2E4; --plum-ink:#2A0B23;
  --good:#4ADE80; --good-soft:#0E3320; --warn:#FDBA74; --warn-soft:#3B1D0E; --bad:#F87171; --bad-soft:#3B1412; --info:#A9C4E0; --info-soft:#1A2E42;
  --wa-bg:#0B141A; --wa-bubble:#005C4B; --wa-btn:#25B26B; --wa-ink:#03140B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#03121A; --bg:#071B21; --surface:#0D262E; --surface-2:#133440; --ink:#E3F0EF; --ink-2:#9DB9BF; --line:#1E4350; --line-strong:#5F7F86; --frame:#000000;
  --teal:#34B8AC; --teal-soft:#10393A; --teal-text:#7ADBD0; --teal-ink:#03201D;
  --gold:#F2A93B; --gold-soft:#3A2A10; --gold-text:#FFCB7A; --gold-ink:#2A1700;
  --plum:#D07CC0; --plum-soft:#3A1A33; --plum-text:#F0B2E4; --plum-ink:#2A0B23;
  --good:#4ADE80; --good-soft:#0E3320; --warn:#FDBA74; --warn-soft:#3B1D0E; --bad:#F87171; --bad-soft:#3B1412; --info:#A9C4E0; --info-soft:#1A2E42;
  --wa-bg:#0B141A; --wa-bubble:#005C4B; --wa-btn:#25B26B; --wa-ink:#03140B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}
.app[data-mode="inv"]{--acc:var(--gold);--acc-soft:var(--gold-soft);--acc-text:var(--gold-text);--acc-ink:var(--gold-ink)}
.app[data-mode="help"]{--acc:var(--plum);--acc-soft:var(--plum-soft);--acc-text:var(--plum-text);--acc-ink:var(--plum-ink)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="hi"] body,html[lang="te"] body{line-height:1.7}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="te"] h1,html[lang="te"] h2{line-height:1.4;letter-spacing:0}
p{margin:0}
a{color:var(--acc-text);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}

/* stage */
.stage{height:100%;width:100%;max-width:1220px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:48px;align-items:center;
  padding-block:20px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.presenter{display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto;padding-right:6px;min-width:0}
.device{width:392px;height:min(840px,calc(100vh - 40px));border:10px solid var(--frame);border-radius:46px;overflow:hidden;box-shadow:0 30px 60px rgba(4,20,26,.25);background:var(--bg);position:relative}
@media (max-width:920px){
  .stage{display:block;padding:0;max-width:none}
  .presenter{display:none}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}

/* presenter */
.p-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px}
.p-brand svg{width:36px;height:36px}
.p-brand small{font-family:var(--f-body);font-size:14px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 10px;color:var(--ink-2)}
.p-title{font-size:clamp(28px,3.2vw,40px);font-weight:800;letter-spacing:-.025em}
.p-lead{font-size:17px;color:var(--ink-2);max-width:56ch}
.p-users{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.p-user{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--ink);min-height:64px}
.p-user:hover{border-color:var(--ink-2)}
.p-user[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.p-user .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.p-user b{display:block;font-size:15.5px;line-height:1.3}
.p-user span{font-size:14px;color:var(--ink-2);line-height:1.35}
.p-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.p-box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:15px}
.p-label{font-size:14px;font-weight:800;color:var(--ink-2)}
.phase{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 10px;font-size:14px;font-weight:800;align-self:flex-start}
.phase.p1{background:var(--teal-soft);color:var(--teal-text)}
.phase.p2{background:var(--gold-soft);color:var(--gold-text)}
.p-ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.p-ctrl{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px dashed var(--line-strong);background:var(--bg);border-radius:14px;padding:8px 12px;min-height:52px;font-weight:700;font-size:15px;color:var(--ink)}
.p-ctrl:hover{border-style:solid}
.p-ctrl small{display:block;font-weight:500;color:var(--ink-2);font-size:14px;line-height:1.3}
details.p-more{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 18px}
details.p-more summary{font-weight:800;cursor:pointer;min-height:32px;display:flex;align-items:center}
details.p-more[open] summary{margin-bottom:10px}
.p-facts{display:flex;flex-direction:column;gap:12px;font-size:15px}
.p-facts b{font-family:var(--f-display);font-size:21px}
.p-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}

/* app shell */
.app{position:relative;height:100%;background:var(--bg);overflow:hidden}
.shell{height:100%;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.appbar .logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px;min-width:0}
.appbar .logo svg{width:28px;height:28px;flex:none}
.bar-title{font-size:20px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-pill{font-size:14px;font-weight:800;background:var(--acc-soft);color:var(--acc-text);border-radius:6px;padding:2px 8px;white-space:nowrap}
.appbar .sp{flex:1}
.icon-btn{border:0;background:var(--surface-2);min-width:48px;height:48px;border-radius:999px;display:inline-grid;place-items:center;color:var(--ink);flex:none;position:relative;padding:0 10px;font-weight:800;font-size:15px}
.icon-btn .badge{position:absolute;top:4px;right:4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#FFFFFF;font-size:14px;line-height:20px;font-weight:800;padding:0 5px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.tabbar{display:grid;border-top:1px solid var(--line);background:var(--surface);padding:6px max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:4px 2px;border-radius:14px;color:var(--ink-2);font-size:14px;font-weight:700;min-width:0}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--acc-text);background:var(--acc-soft)}
.tabbar .ico{width:22px;height:22px}

/* type + blocks */
.h1{font-size:24px;font-weight:800}
.h2{font-size:19px;font-weight:700}
.intro{display:flex;flex-direction:column;gap:8px}
.intro-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad);display:flex;flex-direction:column;gap:12px}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.acc{background:var(--acc-soft);border-color:transparent}
.card.grey{background:var(--surface-2);border:1.5px dashed var(--line-strong)}
.card-h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card-h b{font-size:17px}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.wrap-row{display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;min-height:48px;padding:10px 20px;font-weight:800;font-size:16px;line-height:1.25;text-decoration:none;text-align:center;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--acc-soft);color:var(--acc-text)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn.wa{background:var(--wa-btn);color:var(--wa-ink)}
.btn.sm{padding:8px 16px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;min-height:48px;padding:0 4px;font-weight:800;font-size:15px;color:var(--acc-text);text-decoration:none}
.link-btn .ico{width:18px;height:18px}
.listen{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--acc-soft);color:var(--acc-text);min-height:48px;padding:0 14px;border-radius:999px;font-weight:800;font-size:15px;flex:none;white-space:nowrap}
.listen .ico{width:18px;height:18px}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;min-height:48px;padding:8px 16px;font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip .ico{width:18px;height:18px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:14px;font-weight:800;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.tag.acc{background:var(--acc-soft);color:var(--acc-text)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.ghost{background:transparent;border:1.5px dashed var(--line-strong);color:var(--ink-2)}
.tag .ico{width:15px;height:15px;vertical-align:-2px}
.note{border-radius:var(--r-inner);padding:12px 14px;background:var(--surface-2);color:var(--ink-2);font-size:15px}
.note.acc{background:var(--acc-soft);color:var(--acc-text)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note .ico{width:18px;height:18px;vertical-align:-4px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.big{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--ink-2);line-height:1.35}
.kpi em{font-style:normal;font-size:14px;font-weight:700;color:var(--good)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:48px;padding:6px 6px;font-weight:800;font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.input{width:100%;min-height:48px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r-inner);padding:11px 14px;font-size:16px}
.input:focus{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:0}
textarea.input{resize:vertical;min-height:88px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-weight:800;font-size:16px}
.sub-lbl{font-size:14px;font-weight:800;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
.back{border:0;background:none;display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--ink-2);min-height:48px;padding:12px 8px 12px 0;align-self:flex-start}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .15s;display:inline-block;border:0;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--acc)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.sw-row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;border:0;background:none;text-align:left;color:var(--ink);min-height:56px;padding:4px 0}
.sw-row b{display:block}
.sw-row span.d{display:block;font-size:14px;color:var(--ink-2)}
.fact{display:flex;gap:10px;align-items:center;min-height:48px}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}
.mk.yes{background:var(--good-soft);color:var(--good)}
.mk.no{background:var(--surface-2);color:var(--ink-2)}
.mk.acc{background:var(--acc-soft);color:var(--acc-text)}
.mk.warn{background:var(--warn-soft);color:var(--warn)}
.mk .ico{width:15px;height:15px;stroke-width:3;vertical-align:0}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#FFFFFF;flex:none;font-size:17px}
.person{display:flex;gap:12px;align-items:center}
details.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
details.acc-card summary{font-weight:800;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none;min-height:52px}
details.acc-card summary::-webkit-details-marker{display:none}
details.acc-card summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--ink-2)}
details.acc-card[open] summary::after{content:"–"}
details.acc-card[open]{padding-bottom:14px}
details.acc-card p,details.acc-card li{color:var(--ink-2);font-size:15px}
details.acc-card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.demo-tag{border:1.5px dashed var(--line-strong);color:var(--ink-2);border-radius:6px;padding:0 6px;font-size:14px;font-weight:800}

/* onboarding */
.onb{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:16px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));gap:18px}
.water{position:relative;flex:1;display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding:28px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 70% at 70% 10%,#1A8C84 0%,#0B4F55 55%,#062E36 100%);color:#F3FBFA}
.water.end{justify-content:flex-end}
.water h1{color:#F3FBFA}
.water p{color:#CDEAE6;font-size:17px}
.water .fishmark{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:140px;height:140px;pointer-events:none}
.water .bub{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .water .bub{animation:rise 7s linear infinite}
  .water .fishmark{animation:swim 4s ease-in-out infinite}
  @keyframes rise{from{transform:translateY(40px);opacity:0}20%{opacity:1}to{transform:translateY(-160px);opacity:0}}
  @keyframes swim{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
}
.water .btn.primary{background:#F2A93B;color:#2A1700}
.water .btn.ghost{border-color:rgba(255,255,255,.55);color:#F3FBFA}
.water a,.water .link-btn{color:#F3FBFA}

function speak(text, lang){
  const l = lang || S.lang;
  try{
    const ss = window.speechSynthesis; if (!ss || typeof SpeechSynthesisUtterance === 'undefined') throw new Error('none');
    ss.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = VOICE_LANG[l] || 'en-IN';
    const vs = ss.getVoices ? ss.getVoices() : [];
    const v = vs.find(x => x.lang === u.lang) || vs.find(x => x.lang && x.lang.slice(0,2) === u.lang.slice(0,2));
    if (v) u.voice = v; else if (l !== 'en' && vs.length) toast(t('no_voice', {l:LNAME[l][S.lang]}));
    ss.speak(u);
  }catch(e){ toast(t('no_speech')); }
}

function toast(msg, undo){ UI.toast = {msg, undo, until:Date.now() + 5500}; showToast(); }
function showToast(){
  if (!HAS_DOM) return; const el = document.getElementById('toast'); if (!el) return;
  if (!UI.toast || Date.now() >= UI.toast.until){ el.hidden = true; el.innerHTML = ''; return; }
  el.innerHTML = `<span>${UI.toast.msg}</span>${UI.toast.undo ? `<button data-act="undo">${t('undo')}</button>` : ''}`; el.hidden = false;
  clearTimeout(showToast.t); showToast.t = setTimeout(() => { UI.toast = null; showToast(); }, UI.toast.until - Date.now());
}

    e.preventDefault(); const f = e.target, inp = f.querySelector('input');
    if (!inp || !inp.value.trim()){ toast('Type something first.'); return; }
    if (f.dataset.form === 'reply' && S.pitch){ S.pitch.answers[f.dataset.arg] = inp.value.trim(); save(); toast('Answer posted. Backers can see it.'); render(true); return; }
    inp.value = ''; toast('Question sent (demo). The owner answers in public.');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && UI.sheets.length){ A.close(); save(); render(true); return; }
    if (e.key === 'Tab' && UI.sheets.length){ const top = topSheetEl(); if (!top) return;
      const f = [...top.querySelectorAll('button:not([disabled]),a[href],input,textarea,select,summary,[tabindex="-1"]')].filter(x => x.offsetParent !== null || x === document.activeElement);
      if (!f.length) return; const first = f[0], last = f[f.length - 1];
      if (!top.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } }
  });
  load();
  if (S.pitch){ ['format','demand','mentor'].forEach(k => { if (S.pitch.proofs[k].st === 'checking') after(2000, () => checkProof(k)); }); S.pitch.ms.forEach((m, i) => { if (m.st === 'checking') after(2000, () => releaseMs(i)); }); }
  if (S.onb === 'otp') S.otp = S.otp || '';
  render();
}
</script>
</body>
</html>
